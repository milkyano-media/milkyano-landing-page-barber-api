name: CI/CD Pipeline

run-name: "Deploy Bentleigh: ${{ github.event.head_commit.message || inputs.deploy_reason }}"

on:
  push:
    branches: ["main"]

  workflow_dispatch:
    inputs:
      target_ref:
        type: string
        default: ''
      deploy_reason:
        type: string
        default: 'Manual rebuild'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout specific commit
        if: ${{ inputs.target_ref != '' }}
        run: git checkout ${{ inputs.target_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci
      - run: npm run build --if-present

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout specific commit
        if: ${{ inputs.target_ref != '' }}
        run: git checkout ${{ inputs.target_ref }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: milkyano/fadedlines-bentleigh:latest

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.PIPELINE_PRIVATE_KEY }}
          port: 22
          script: |
            docker pull milkyano/fadedlines-bentleigh:latest
            docker stop fadedlines-bentleigh || true
            docker rm fadedlines-bentleigh || true
            docker run -d \
              -p 80:8083 \
              --env-file /opt/fadedlines-bentleigh/.env \
              --network fadedline-api_fadedline-network \
              --restart unless-stopped \
              --name fadedlines-bentleigh \
              milkyano/fadedlines-bentleigh:latest
            docker logs --tail 50 fadedlines-bentleigh
